# Local development dependencies. Brings up PostgreSQL for the API.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: furfairy-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: furfairy
    ports:
      - '5432:5432'
    volumes:
      - furfairy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  furfairy_pg_data:
